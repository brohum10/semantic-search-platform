[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-search-platform"
version = "2.0.0"
description = "An explainable hybrid search service with dense retrieval, BM25, metadata filters, and source-backed responses."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Soham Jindal"}]
keywords = ["information-retrieval", "semantic-search", "bm25", "faiss", "flask"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Flask",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "Flask>=3.1,<4",
  "numpy>=2.0,<3",
  "gunicorn>=23,<24",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.9,<2; python_version < '3.14'"]
dev = ["build>=1.2,<2", "pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1"]

[project.urls]
Homepage = "https://github.com/brohum10/semantic-search-platform"
Repository = "https://github.com/brohum10/semantic-search-platform"
Issues = "https://github.com/brohum10/semantic-search-platform/issues"

[project.scripts]
semantic-search = "semantic_search.api:main"
semantic-search-benchmark = "semantic_search.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["semantic_search"]
branch = true
omit = ["src/semantic_search/benchmark.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
